name: image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - config/**
      - alembic/**
      - alembic.ini
      - scripts/start.sh
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock

permissions:
  id-token: write # OIDC: short-lived AWS credentials, no stored keys
  contents: read

jobs:
  build-push:
    # Skipped until infra/envs/dev has been applied and the repo variables set.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          image="$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker build -t "$image" .
          docker push "$image"
          echo "Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"

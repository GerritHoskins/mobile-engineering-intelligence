services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mei
      POSTGRES_PASSWORD: mei
      POSTGRES_DB: mei
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mei -d mei"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://mei:mei@postgres:5432/mei
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
